<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F4E79">
<title>ATMs BPN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --azul:#1F4E79;--azul2:#2E75B6;--verde:#375623;
    --bg:#f0f4f8;--card:#fff;--texto:#1a1a2e;--gris:#6b7280;
    --shadow:0 2px 12px rgba(0,0,0,.12);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:var(--bg);color:var(--texto);height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* HEADER */
  header{background:var(--azul);color:#fff;padding:10px 14px;
         display:flex;align-items:center;gap:10px;
         box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:1000;flex-shrink:0}
  header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
  header span{font-size:11px;opacity:.75;margin-left:auto}
  .logo{width:32px;height:32px;background:#fff2;border-radius:8px;
        display:flex;align-items:center;justify-content:center;font-size:18px}

  /* PANEL DE BÚSQUEDA */
  #panel{background:var(--card);padding:10px 12px;
         box-shadow:var(--shadow);z-index:900;flex-shrink:0}
  .search-row{display:flex;gap:8px;margin-bottom:8px}
  #buscar{flex:1;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:10px;
          font-size:15px;outline:none;transition:.2s}
  #buscar:focus{border-color:var(--azul2)}
  .btn-limpiar{background:var(--azul);color:#fff;border:none;padding:9px 14px;
               border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap}
  .filtros{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .filtros::-webkit-scrollbar{display:none}
  select{padding:7px 10px;border:1.5px solid #d1d5db;border-radius:8px;
         font-size:13px;background:#fff;cursor:pointer;outline:none;min-width:0}
  select:focus{border-color:var(--azul2)}
  .chip-count{background:var(--azul2);color:#fff;border-radius:20px;
              padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;
              display:flex;align-items:center}

  /* MAPA */
  #mapa{flex:1;z-index:1}

  /* PANEL INFERIOR (resultado seleccionado) */
  #info-panel{position:fixed;bottom:0;left:0;right:0;
              background:#fff;border-radius:18px 18px 0 0;
              box-shadow:0 -4px 20px rgba(0,0,0,.18);
              padding:16px;z-index:2000;
              transform:translateY(100%);transition:transform .3s ease;
              max-height:70vh;overflow-y:auto}
  #info-panel.visible{transform:translateY(0)}
  .drag-bar{width:40px;height:4px;background:#d1d5db;border-radius:2px;
            margin:0 auto 14px;cursor:pointer}
  .info-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .info-icon{width:44px;height:44px;border-radius:12px;background:var(--azul);
             color:#fff;display:flex;align-items:center;justify-content:center;
             font-size:22px;flex-shrink:0}
  .info-title h2{font-size:15px;font-weight:700;line-height:1.3}
  .info-title p{font-size:12px;color:var(--gris);margin-top:2px}
  .info-body{display:grid;gap:8px}
  .info-row{display:flex;gap:8px;align-items:flex-start}
  .info-label{font-size:11px;color:var(--gris);text-transform:uppercase;
              letter-spacing:.5px;min-width:72px;padding-top:1px}
  .info-val{font-size:14px;font-weight:500;flex:1}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;
         font-size:11px;font-weight:600;text-transform:uppercase}
  .badge-dn{background:#D6EAF8;color:#1F4E79}
  .badge-ncr{background:#C6EFCE;color:#375623}
  .badge-wincor{background:#FCE4D6;color:#843C0C}
  .badge-diebold{background:#FFCCCC;color:#C9513E}
  .badge-otro{background:#f0f0f0;color:#555}
  .btn-ver-mapa{width:100%;margin-top:14px;padding:12px;
                background:var(--azul);color:#fff;border:none;
                border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-cerrar{position:absolute;top:14px;right:14px;background:none;
              border:none;font-size:22px;cursor:pointer;color:var(--gris)}

  /* LISTA LATERAL (en tablet/desktop) */
  @media(min-width:768px){
    body{flex-direction:row}
    #panel{width:320px;height:100%;overflow-y:auto;
           display:flex;flex-direction:column;gap:0;padding:0}
    .search-wrap{padding:14px}
    .search-row{flex-direction:column}
    #lista{flex:1;overflow-y:auto}
    .lista-item{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;
                transition:.15s}
    .lista-item:hover{background:#f0f4f8}
    .lista-item.activo{background:#e8f0fe;border-left:3px solid var(--azul2)}
    .lista-item h3{font-size:14px;font-weight:600}
    .lista-item p{font-size:12px;color:var(--gris);margin-top:2px}
    #mapa{flex:1}
    #info-panel{position:relative;transform:none!important;
                box-shadow:none;border-radius:0;padding:14px;
                border-top:1px solid #eee}
  }

  /* Marcador personalizado */
  .marker-label{
    background:var(--azul);color:#fff;border-radius:8px;
    padding:3px 7px;font-size:11px;font-weight:700;
    white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);
    border:2px solid #fff;
  }
  .marker-label.marca-ncr{background:#375623}
  .marker-label.marca-wincor{background:#843C0C}
  .marker-label.marca-diebold{background:#C9513E}
  .marker-label.marca-dn{background:#1F4E79}
</style>
</head>

  const m = (marca||'').toLowerCase();
  if(m.includes('ncr'))    return {bg:'#375623',cls:'marca-ncr'};
  if(m.includes('wincor')) return {bg:'#843C0C',cls:'marca-wincor'};
  if(m.includes('diebold'))return {bg:'#C9513E',cls:'marca-diebold'};
  if(m.includes('dn'))     return {bg:'#1F4E79',cls:'marca-dn'};
  return {bg:'#555',cls:''};
}

function badgeMarca(marca){
  const m = (marca||'').toLowerCase();
  if(m.includes('ncr'))    return `<span class="badge badge-ncr">NCR</span>`;
  if(m.includes('wincor')) return `<span class="badge badge-wincor">Wincor</span>`;
  if(m.includes('diebold'))return `<span class="badge badge-diebold">Diebold</span>`;
  if(m.includes('dn'))     return `<span class="badge badge-dn">DN</span>`;
  return `<span class="badge badge-otro">${marca||'—'}</span>`;
}

function crearMarcador(atm){
  const col = colorMarca(atm.marca);
  const icon = L.divIcon({
    className:'',
    html:`<div class="marker-label ${col.cls}">${atm.id}</div>`,
    iconAnchor:[20,10]
  });
  const m = L.marker([atm.lat, atm.lon], {icon})
    .on('click', ()=>{ seleccionar(atm); });
  m._atmData = atm;
  return m;
}

// Cluster-like: mostrar todos con marcadores
const layerGroup = L.layerGroup().addTo(mapa);

function renderMarcadores(lista){
  layerGroup.clearLayers();
  marcadores = [];
  lista.forEach(atm => {
    const m = crearMarcador(atm);
    m.addTo(layerGroup);
    marcadores.push(m);
  });
}

// ── FILTROS Y BÚSQUEDA ────────────────────────────────────────────────────────
const selCiudad = document.getElementById('fil-ciudad');
const selMarca  = document.getElementById('fil-marca');
const chipCount = document.getElementById('chip-count');
const headerCount = document.getElementById('header-count');

// Poblar selects
DATA.ciudades.forEach(c=>{
  const o=document.createElement('option'); o.value=c; o.textContent=c;
  selCiudad.appendChild(o);
});
// Marcas (solo hardware)
['DIEBOLD','DN','NCR','WINCOR'].forEach(m=>{
  const o=document.createElement('option'); o.value=m; o.textContent=m;
  selMarca.appendChild(o);
});

let filtrados = [...todosATMs];

function aplicarFiltros(){
  const q      = document.getElementById('buscar').value.toLowerCase().trim();
  const ciudad = selCiudad.value;
  const marca  = selMarca.value.toLowerCase();

  filtrados = todosATMs.filter(a=>{
    if(ciudad && a.ciudad !== ciudad) return false;
    if(marca  && !a.marca.toLowerCase().includes(marca)) return false;
    if(q){
      const hay = [a.id.toString(), a.nombre, a.ciudad, a.direccion, a.ip||'']
                    .join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  renderMarcadores(filtrados);
  renderLista(filtrados);
  chipCount.textContent = filtrados.length;

  // Ajustar vista
  if(filtrados.length > 0 && filtrados.length < todosATMs.length){
    const bounds = L.latLngBounds(filtrados.map(a=>[a.lat,a.lon]));
    mapa.fitBounds(bounds, {padding:[40,40]});
  }
}

document.getElementById('buscar').addEventListener('input', aplicarFiltros);

function limpiar(){
  document.getElementById('buscar').value='';
  selCiudad.value='';
  selMarca.value='';
  aplicarFiltros();
  mapa.setView([-38.95,-68.07],8);
}

// ── LISTA (visible en desktop) ────────────────────────────────────────────────
function renderLista(lista){
  const el = document.getElementById('lista');
  if(!el) return;
  el.innerHTML = lista.slice(0,200).map(a=>`
    <div class="lista-item" onclick="seleccionar(DATA.atms.find(x=>x.id===${a.id}))">
      <h3>🏧 ${a.id} — ${a.nombre}</h3>
      <p>📍 ${a.ciudad} &nbsp;·&nbsp; ${a.marca}</p>
    </div>
  `).join('') + (lista.length>200?`<div style="padding:10px;color:#888;text-align:center;font-size:12px">Mostrando 200 de ${lista.length}. Refiná la búsqueda.</div>`:'');
}

// ── SELECCIÓN ─────────────────────────────────────────────────────────────────
function seleccionar(atm){
  if(!atm) return;
  mapa.setView([atm.lat, atm.lon], 16);
  mostrarPanel(atm);

  // Resaltar marcador
  marcadores.forEach(m=>{
    const col = colorMarca(m._atmData.marca);
    const activo = m._atmData.id === atm.id;
    const icon = L.divIcon({
      className:'',
      html:`<div class="marker-label ${col.cls}" style="${activo?'transform:scale(1.4);z-index:999;box-shadow:0 0 0 3px #FFD700':''}">
              ${m._atmData.id}</div>`,
      iconAnchor:[20,10]
    });
    m.setIcon(icon);
  });
}

// ── PANEL INFERIOR ────────────────────────────────────────────────────────────
function mostrarPanel(atm){
  const panel = document.getElementById('info-panel');
  const cont  = document.getElementById('info-contenido');

  const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${atm.lat},${atm.lon}`;

  cont.innerHTML = `
    <div class="info-header">
      <div class="info-icon">🏧</div>
      <div class="info-title">
        <h2>ATM ${atm.id} — ${atm.nombre}</h2>
        <p>${atm.ciudad}</p>
      </div>
    </div>
    <div class="info-body">
      <div class="info-row">
        <span class="info-label">Dirección</span>
        <span class="info-val">${atm.direccion||'—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Ciudad</span>
        <span class="info-val">${atm.ciudad||'—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Marca</span>
        <span class="info-val">${badgeMarca(atm.marca)}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Modelo</span>
        <span class="info-val">${atm.modelo||'—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">IP</span>
        <span class="info-val" id="ip-val">${atm.ip||'<span style="color:#999">No registrada</span>'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Coords</span>
        <span class="info-val" style="font-size:12px;color:#888">${atm.lat}, ${atm.lon}</span>
      </div>
    </div>
    <a href="${gmapsUrl}" target="_blank">
      <button class="btn-ver-mapa">🗺  Cómo llegar en Google Maps</button>
    </a>
  `;

  panel.classList.add('visible');
}

function cerrarPanel(){
  document.getElementById('info-panel').classList.remove('visible');
  // Quitar resaltado
  marcadores.forEach(m=>{
    const col = colorMarca(m._atmData.marca);
    const icon = L.divIcon({
      className:'',
      html:`<div class="marker-label ${col.cls}">${m._atmData.id}</div>`,
      iconAnchor:[20,10]
    });
    m.setIcon(icon);
  });
}

// Cerrar panel al tocar el mapa
mapa.on('click', cerrarPanel);

// ── INIT ──────────────────────────────────────────────────────────────────────
renderMarcadores(todosATMs);
renderLista(todosATMs);
headerCount.textContent = `${todosATMs.length} cajeros`;

</script>
</body>
</html>
