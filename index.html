<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a6db5">
<title>ATMs BPN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --azul:#1a6db5;--azul2:#2E75B6;
  --bg:#f0f4f8;--gris:#6b7280;
  --verde-dark:#1B5E20;
  --shadow:0 2px 12px rgba(0,0,0,.12);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#1a1a2e}

/* ── HEADER ── */
header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--azul);color:#fff;
  height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
header h1{font-size:17px;font-weight:700;flex:1}
.hdr-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4);flex-shrink:0}
#hdr-count{font-size:11px;opacity:.75;white-space:nowrap}

/* ── BUSCADOR ── */
#barra-busqueda{
  position:fixed;top:52px;left:0;right:0;z-index:190;
  background:#fff;padding:10px 12px 8px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.search-row{display:flex;gap:8px;margin-bottom:8px}
#buscar{
  flex:1;padding:9px 12px;border:1.5px solid #d1d5db;
  border-radius:10px;font-size:15px;outline:none;
  background:#f9fafb;
}
#buscar:focus{border-color:var(--azul2);background:#fff}
.btn-limpiar{
  background:var(--azul);color:#fff;border:none;
  padding:9px 14px;border-radius:10px;font-size:14px;cursor:pointer;
}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filtros::-webkit-scrollbar{display:none}
select{
  padding:7px 10px;border:1.5px solid #d1d5db;border-radius:8px;
  font-size:13px;background:#fff;cursor:pointer;outline:none;flex-shrink:0;
}
.chip{
  background:var(--azul2);color:#fff;border-radius:20px;
  padding:5px 12px;font-size:12px;font-weight:700;
  white-space:nowrap;display:flex;align-items:center;
}

/* ── VISTAS ── */
/* Vista LISTADO (mobile default) */
#vista-lista{
  position:fixed;
  top:calc(52px + 88px); /* header + barra busqueda */
  left:0;right:0;bottom:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);z-index:100;
}

/* Vista MAPA (se muestra al seleccionar un cajero en mobile) */
#vista-mapa{
  position:fixed;top:52px;left:0;right:0;bottom:0;
  z-index:150;display:none;flex-direction:column;
}
#vista-mapa.visible{display:flex}
#mapa{flex:1;min-height:0;touch-action:pan-x pan-y pinch-zoom}

/* ── ITEM DE LISTA ── */
.li{
  background:#fff;margin:6px 10px;border-radius:12px;
  padding:12px 14px;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  display:flex;align-items:center;gap:12px;
  transition:transform .1s;
  -webkit-user-select:none;
}
.li:active{transform:scale(.98);background:#f0f4f8}
.li-logo{
  width:40px;height:40px;border-radius:10px;
  overflow:hidden;flex-shrink:0;
  border:1.5px solid #e5e7eb;
}
.li-logo img{width:100%;height:100%;object-fit:cover}
.li-body{flex:1;min-width:0}
.li-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:12px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-contacto{font-size:11px;color:var(--azul);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-arrow{color:#d1d5db;font-size:16px;flex-shrink:0}

/* Badge marca */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-dn{background:#D6EAF8;color:#1F4E79}
.b-ncr{background:#C6EFCE;color:#375623}
.b-wincor{background:#FCE4D6;color:#843C0C}
.b-diebold{background:#FFCCCC;color:#C9513E}
.b-otro{background:#f0f0f0;color:#555}

/* ── PANEL DETALLE (encima del mapa) ── */
#detalle{
  background:#fff;
  border-radius:18px 18px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.18);
  padding:14px 16px 32px;
  max-height:55vh;
  overflow-y:scroll;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  flex-shrink:0;
}
.drag-bar{width:40px;height:4px;background:#d1d5db;border-radius:2px;margin:0 auto 12px}

/* Botón volver al listado */
#btn-volver{
  position:absolute;top:60px;left:12px;z-index:160;
  background:#fff;border:none;border-radius:10px;
  padding:8px 14px;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;
  display:flex;align-items:center;gap:6px;color:var(--azul);
}

/* Header del detalle */
.d-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.d-logo{width:46px;height:46px;border-radius:11px;overflow:hidden;flex-shrink:0;border:2px solid #e5e7eb}
.d-logo img{width:100%;height:100%;object-fit:cover}
.d-title h2{font-size:15px;font-weight:700;line-height:1.3}
.d-title p{font-size:12px;color:var(--gris);margin-top:2px}

/* Datos técnicos */
.datos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.dato{background:#f8fafc;border-radius:10px;padding:9px 11px}
.dato-lbl{font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.dato-val{font-size:13px;font-weight:600}
.dato-val.ip{font-family:monospace;font-size:11px;color:var(--azul)}

/* Contactos */
.c-titulo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--azul);margin-bottom:8px}
.c-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;padding:11px;margin-bottom:8px}
.c-card:first-of-type{border-color:var(--azul);background:#EBF3FB}
.c-rol{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.c-rol.adm{color:#C9513E}.c-rol.teso{color:#375623}.c-rol.ger{color:var(--azul)}.c-rol.otro{color:var(--gris)}
.c-nombre{font-size:14px;font-weight:600;margin-bottom:7px}
.c-acciones{display:flex;gap:7px}
.btn-llamar{flex:1;background:#25D366;color:#fff;border:none;padding:9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.btn-copiar{background:#f0f4f8;color:#1a1a2e;border:1px solid #d1d5db;padding:9px 12px;border-radius:9px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-copiar.copiado{background:#C6EFCE;border-color:#375623;color:#375623}
.sin-cel{font-size:12px;color:#aaa;font-style:italic}
.btn-gmaps{width:100%;margin-top:10px;padding:11px;background:var(--azul);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:block;text-align:center;text-decoration:none}

/* ── DESKTOP ── */
@media(min-width:768px){
  #barra-busqueda{top:52px}
  #vista-lista{top:calc(52px + 88px);width:360px;bottom:0}
  #vista-mapa{display:flex!important;top:52px;left:360px}
  #btn-volver{display:none}
  #detalle{max-height:45vh}
  .li{margin:5px 8px}
}

/* Marcadores */
.mk{background:var(--azul);color:#fff;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff}
.mk.ncr{background:#375623}.mk.wincor{background:#843C0C}.mk.diebold{background:#C9513E}
</style>
</head>

const TODOS = D.atms;

// ── MAPA ──────────────────────────────────────────────────────────────────────
const mapa = L.map('mapa',{zoomControl:false}).setView([-38.95,-68.07],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'© OpenStreetMap',maxZoom:19}).addTo(mapa);
L.control.zoom({position:'bottomright'}).addTo(mapa);
const lg = L.layerGroup().addTo(mapa);
let mks=[];

function mkColor(m){
  const s=(m||'').toLowerCase();
  if(s.includes('ncr'))    return 'ncr';
  if(s.includes('wincor')) return 'wincor';
  if(s.includes('diebold'))return 'diebold';
  return '';
}
function badge(m){
  const s=(m||'').toLowerCase();
  if(s.includes('ncr'))    return `<span class="badge b-ncr">NCR</span>`;
  if(s.includes('wincor')) return `<span class="badge b-wincor">Wincor</span>`;
  if(s.includes('diebold'))return `<span class="badge b-diebold">Diebold</span>`;
  if(s.includes('dn'))     return `<span class="badge b-dn">DN</span>`;
  return `<span class="badge b-otro">${m||'—'}</span>`;
}
function rolClass(rol){
  const r=(rol||'').toLowerCase();
  if(r.includes('adm'))  return 'adm';
  if(r.includes('teso')) return 'teso';
  if(r.includes('ger')||r.includes('resp')) return 'ger';
  return 'otro';
}

function crearMk(atm){
  const cls=mkColor(atm.marca);
  const ico=L.divIcon({
    className:'',
    html:`<div class="mk ${cls}">${atm.id}</div>`,
    iconAnchor:[20,10]
  });
  const m=L.marker([atm.lat,atm.lon],{icon:ico})
    .on('click',()=>seleccionar(atm));
  m._d=atm; return m;
}

function renderMks(lista){
  lg.clearLayers(); mks=[];
  lista.forEach(a=>{ const m=crearMk(a); m.addTo(lg); mks.push(m); });
}

// ── FILTROS ───────────────────────────────────────────────────────────────────
D.ciudades.forEach(c=>{
  const o=document.createElement('option'); o.value=c; o.textContent=c;
  document.getElementById('fil-ciudad').appendChild(o);
});

let filtrados=[...TODOS];

function filtrar(){
  const q    = document.getElementById('buscar').value.toLowerCase().trim();
  const ciu  = document.getElementById('fil-ciudad').value;
  const marc = document.getElementById('fil-marca').value.toLowerCase();

  filtrados = TODOS.filter(a=>{
    if(ciu  && a.ciudad!==ciu)                         return false;
    if(marc && !a.marca.toLowerCase().includes(marc))  return false;
    if(q){
      const txt=[a.id,a.nombre,a.ciudad,a.direccion,a.ip,
                 ...(a.contactos||[]).map(c=>c.nombre+' '+c.rol)
                ].join(' ').toLowerCase();
      if(!txt.includes(q)) return false;
    }
    return true;
  });

  renderLista(filtrados);
  renderMks(filtrados);
  document.getElementById('chip-count').textContent = filtrados.length;

  if(filtrados.length>0 && filtrados.length<TODOS.length){
    const bounds=L.latLngBounds(filtrados.map(a=>[a.lat,a.lon]));
    mapa.fitBounds(bounds,{padding:[40,40]});
  }
}

document.getElementById('buscar').addEventListener('input',filtrar);

function limpiar(){
  document.getElementById('buscar').value='';
  document.getElementById('fil-ciudad').value='';
  document.getElementById('fil-marca').value='';
  filtrar();
  mapa.setView([-38.95,-68.07],8);
}

// ── LISTA ─────────────────────────────────────────────────────────────────────
function renderLista(lista){
  const el=document.getElementById('vista-lista');
  const items=lista.slice(0,300).map(a=>{
    const c0=a.contactos&&a.contactos[0];
    const contLine=c0?`<div class="li-contacto">👤 ${c0.nombre} · ${c0.rol}</div>`:'';
    return `
      <div class="li" onclick="seleccionar(TODOS.find(x=>x.id===${a.id}))">
        <div class="li-logo"><img src="${LOGO}" alt="BPN" loading="lazy"></div>
        <div class="li-body">
          <div class="li-title">${a.id} — ${a.nombre}</div>
          <div class="li-sub">📍 ${a.ciudad} &nbsp;·&nbsp; ${badge(a.marca)}</div>
          ${contLine}
        </div>
        <div class="li-arrow">›</div>
      </div>`;
  }).join('');

  const footer=lista.length>300
    ?`<div style="padding:14px;text-align:center;font-size:12px;color:#888">Mostrando 300 de ${lista.length}. Refiná la búsqueda.</div>`
    :`<div style="height:20px"></div>`;

  el.innerHTML=items+footer;
}

// ── NAVEGACIÓN MOBILE ─────────────────────────────────────────────────────────
const isMobile = ()=>window.innerWidth<768;

function mostrarMapa(){
  if(isMobile()){
    document.getElementById('vista-lista').style.display='none';
    document.getElementById('vista-mapa').classList.add('visible');
    setTimeout(()=>mapa.invalidateSize(),50);
  }
}

function volverLista(){
  document.getElementById('vista-lista').style.display='';
  document.getElementById('vista-mapa').classList.remove('visible');
}

// ── SELECCIÓN ─────────────────────────────────────────────────────────────────
function copiar(cel,id){
  const num=cel.replace(/[^+\d]/g,'');
  navigator.clipboard.writeText(num).catch(()=>{
    const t=document.createElement('textarea');
    t.value=num; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
  });
  const btn=document.getElementById(id);
  if(btn){
    btn.classList.add('copiado'); btn.innerHTML='✓ Copiado';
    setTimeout(()=>{btn.classList.remove('copiado');btn.innerHTML='📋 Copiar';},2000);
  }
}

function cCard(c,idx){
  if(!c) return '';
  const rc=rolClass(c.rol);
  const num=(c.cel||'').replace(/[^+\d]/g,'');
  return `
    <div class="c-card">
      <div class="c-rol ${rc}">${c.rol}</div>
      <div class="c-nombre">${c.nombre||'—'}</div>
      ${c.cel
        ? `<div class="c-acciones">
             <a class="btn-llamar" href="tel:${num}">📞 Llamar</a>
             <button class="btn-copiar" id="cp${idx}" onclick="copiar('${c.cel}','cp${idx}')">📋 Copiar</button>
           </div>`
        : `<div class="sin-cel">Sin número de celular</div>`
      }
    </div>`;
}

function seleccionar(atm){
  if(!atm) return;

  // Mostrar mapa en mobile
  mostrarMapa();

  // Centrar en mapa
  mapa.setView([atm.lat,atm.lon],16);

  // Resaltar marcador
  mks.forEach(m=>{
    const cls=mkColor(m._d.marca);
    const activo=m._d.id===atm.id;
    m.setIcon(L.divIcon({
      className:'',
      html:`<div class="mk ${cls}" style="${activo?'transform:scale(1.5);z-index:999;box-shadow:0 0 0 3px gold':''}">${m._d.id}</div>`,
      iconAnchor:[20,10]
    }));
  });

  // Renderizar detalle
  const conts=(atm.contactos||[]).map((c,i)=>cCard(c,atm.id+'_'+i)).join('');
  const gmaps=`https://www.google.com/maps/dir/?api=1&destination=${atm.lat},${atm.lon}`;

  document.getElementById('detalle-body').innerHTML=`
    <div class="d-header">
      <div class="d-logo"><img src="${LOGO}" alt="BPN"></div>
      <div class="d-title">
        <h2>ATM ${atm.id} — ${atm.nombre}</h2>
        <p>📍 ${atm.ciudad}${atm.nrosuc?' · Suc. '+atm.nrosuc:''}</p>
      </div>
    </div>
    <div class="datos-grid">
      <div class="dato">
        <div class="dato-lbl">Marca / Modelo</div>
        <div class="dato-val">${badge(atm.marca)} ${atm.modelo||''}</div>
      </div>
      <div class="dato">
        <div class="dato-lbl">IP</div>
        <div class="dato-val ip">${atm.ip||'No registrada'}</div>
      </div>
      <div class="dato" style="grid-column:1/-1">
        <div class="dato-lbl">Dirección</div>
        <div class="dato-val" style="font-size:12px">${atm.direccion||'—'}</div>
      </div>
    </div>
    ${conts?`<div class="c-titulo">Contactos de sucursal</div>${conts}`
            :`<p style="color:#aaa;font-size:13px">Sin contactos registrados</p>`}
    <a href="${gmaps}" target="_blank" class="btn-gmaps">🗺  Cómo llegar — Google Maps</a>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderLista(TODOS);
renderMks(TODOS);
document.getElementById('hdr-count').textContent=`${TODOS.length} cajeros`;
document.getElementById('chip-count').textContent=TODOS.length;

// Desktop: mostrar mapa siempre
if(!isMobile()){
  document.getElementById('vista-mapa').classList.add('visible');
}
</script>
