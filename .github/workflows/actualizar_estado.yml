name: Actualizar Estado ATMs

on:
  schedule:
    - cron: '0 * * * *'   # cada hora
  workflow_dispatch:        # también manual desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias SIGMA
        run: |
          pip install --break-system-packages \
            selenium webdriver-manager \
            pandas xlrd openpyxl lxml html5lib

      - name: Instalar dependencias Jira
        run: |
          pip install --break-system-packages requests

      - name: Ejecutar agente SIGMA
        env:
          SIGMA_USER:     ${{ secrets.SIGMA_USER }}
          SIGMA_PASSWORD: ${{ secrets.SIGMA_PASSWORD }}
        run: python agente_sigma.py
        continue-on-error: true   # si SIGMA falla, igual corre Jira

      - name: Ejecutar agente Jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python agente_jira.py
        continue-on-error: true   # si Jira falla, igual commitea SIGMA

      - name: Subir debug de SIGMA (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sigma-debug
          path: |
            sigma_debug.html
            sigma_monitor.html
          if-no-files-found: ignore

      - name: Commitear JSONs actualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Agregar solo los archivos que existan
          for f in estado_atms.json tickets_atms.json; do
            [ -f "$f" ] && git add "$f"
          done

          # Solo commitear si hay cambios
          if git diff --staged --quiet; then
            echo "Sin cambios en los JSONs"
          else
            git commit -m "Auto: actualizar estado ATMs y tickets Jira [skip ci]"
            git push
          fi
